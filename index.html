<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เว็บไซต์ของฉัน</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

<script>
const ME = {

  // GitHub username ของคุณ ใช้ดึงรูปโปรไฟล์มาแสดงอัตโนมัติ ไม่ต้องอัปโหลดรูปเอง
  github: "pinetporn",

  // ชื่อที่ต้องการให้แสดง ใช้ชื่อเล่นได้
  name: "pinetporn.ch",

  // บอกว่าคุณคือใคร สั้น ๆ
  role: "นักศึกษาวิศวกรรมคอมพิวเตอร์ ปี 2 · มทร.อีสาน",

  // หนึ่งประโยคว่าคุณสนใจสร้างอะไร เขียนให้เจาะจง อย่าเขียนกว้าง ๆ
  // ไม่ดี: "รักการเขียนโปรแกรม"     ดี: "อยากทำระบบรดน้ำต้นไม้ที่ดูพยากรณ์อากาศก่อนรดน้ำ"
  tagline: "สนใจระบบเว็บคอนโทรเลอร์อุปกรณ์แบบเรียลไทม์",

  // แนะนำตัว 2-3 บรรทัด ว่ามาจากไหน สนใจอะไร กำลังจะไปทางไหน
  about: "นักศึกษาวิศวกรรมคอมพิวเตอร์ที่ชอบพัฒนาเว็บและลองทำอะไรใหม่ ๆ กำลังเรียนรู้และพัฒนาตัวเองเพื่อเติบโตเป็น Web Developer",

  // กำลังเรียนรู้อะไรอยู่ตอนนี้ ใส่ได้ 2-5 รายการ
learning: [
  "HTML และ CSS",
  "JavaScript",
  "Git และ GitHub",
  "พื้นฐาน Backend และ API",
  "ฐานข้อมูลและ SQL",
],

  // ผลงาน ปี 1 เทอมแรกยังไม่มีก็ไม่เป็นไร ปล่อยว่างไว้ได้ หน้าเว็บจะขึ้นข้อความให้เอง
  // เมื่อมีงานแล้วค่อยเพิ่มทีละชิ้น เช่น
  // { title: "เครื่องวัดอุณหภูมิห้อง", desc: "ใช้ Arduino กับเซนเซอร์ DHT11", url: "" },
  works: [],

  // ช่องทางติดต่อ ใช้ลิงก์สาธารณะเท่านั้น อย่าใส่เบอร์โทรหรืออีเมลส่วนตัว
  links: [
    { label: "GitHub", url: "https://github.com/pinetporn" },
  ],

  // ธีมสี เลือกหนึ่งอย่าง: "ocean" | "sunset" | "forest" | "grape" | "mono" | "mono-light"
  theme: "ocean",

};
</script>

<style>
/* ---------- สีพื้นฐาน ทุกธีมใช้ร่วมกัน ---------- */
:root {
  --bg:#0b1020; --line:#24304f; --text:#e8edf7; --muted:#93a1c0;
  --surface:rgba(255,255,255,.05);      /* พื้นของการ์ดผลงานและแผงข้อมูล */
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

/* ---------- ธีมสี ---------- */
:root,
[data-theme="ocean"]  { --accent:#38bdf8; --accent-soft:#0ea5e9; --glow1:rgba(56, 189, 248, 0.35); --glow2:rgba(14, 165, 233, 0.25); }
[data-theme="sunset"] { --accent:#fb923c; --accent-soft:#f97316; --glow1:rgba(251, 146, 60, 0.35); --glow2:rgba(249, 115, 22, 0.25); }
[data-theme="forest"] { --accent:#34d399; --accent-soft:#10b981; --glow1:rgba(52, 211, 153, 0.35); --glow2:rgba(16, 185, 129, 0.25); }
[data-theme="grape"]  { --accent:#c084fc; --accent-soft:#a855f7; --glow1:rgba(192, 132, 252, 0.35); --glow2:rgba(168, 85, 247, 0.25); }
[data-theme="mono"]   { --accent:#e2e8f0; --accent-soft:#cbd5e1; --glow1:rgba(226, 232, 240, 0.25); --glow2:rgba(203, 213, 225, 0.2); }

[data-theme="mono-light"] {
  --accent:#334155; --accent-soft:#475569; --glow1:rgba(51, 65, 85, 0.15); --glow2:rgba(71, 85, 105, 0.12);
  --bg:#f7f9fc; --line:#ccd6e4; --text:#0f172a; --muted:#52627d;
  --surface:rgba(15,23,42,.04);
}

*{ box-sizing:border-box }

body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:"Segoe UI","Noto Sans Thai",system-ui,sans-serif;
  line-height:1.75;
  background:
    radial-gradient(600px 600px at 15% 15%, var(--glow1) 0, transparent 70%),
    radial-gradient(600px 600px at 85% 85%, var(--glow2) 0, transparent 70%),
    radial-gradient(400px 400px at 50% 50%, rgba(244, 114, 182, 0.15) 0, transparent 80%),
    var(--bg);
  background-attachment: fixed;
  overflow-x: hidden;
}

/* ---------- อนิเมชันพื้นหลังลอยน่ารักๆ (Cute Floating Bubbles) ---------- */
body::before, body::after {
  content: "✨";
  position: fixed;
  font-size: 24px;
  opacity: 0.6;
  animation: floatSparkle 6s ease-in-out infinite alternate;
  pointer-events: none;
  z-index: 0;
}
body::before { top: 12%; left: 8%; animation-delay: 0s; }
body::after { bottom: 15%; right: 8%; animation-delay: 3s; content: "🌸"; }

@keyframes floatSparkle {
  0% { transform: translateY(0px) rotate(0deg) scale(1); }
  100% { transform: translateY(-20px) rotate(20deg) scale(1.2); }
}

/* ---------- Bento Layout เวอร์วังน่ารัก ---------- */
.wrap {
  max-width: 1000px;
  margin: 0 auto;
  padding: 40px 20px 80px;
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 22px;
  position: relative;
  z-index: 1;
}

/* โครงสร้างการ์ดแบบ Soft Glassmorphism + Bouncy Hover */
.hero, .about, .links, section {
  background: var(--surface);
  border: 2px solid rgba(255, 255, 255, 0.08);
  border-radius: 28px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}

.hero:hover, .about:hover, .links:hover, section:hover {
  transform: translateY(-8px) scale(1.01);
  border-color: var(--accent);
  box-shadow: 0 20px 40px -10px var(--glow1), 0 0 20px var(--accent-soft);
}

/* แสงสีรุ้งพาดผ่านเวลาย้ายเมาส์ (Rainbow Shimmer) */
.hero::after, .about::after, .links::after, section::after {
  content: '';
  position: absolute;
  top: 0; left: -100%; width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  transform: skewX(-25deg);
  transition: left 0.75s ease;
  pointer-events: none;
}

.hero:hover::after, .about:hover::hover::after, .links:hover::after, section:hover::after {
  left: 150%;
}

/* Hero Section อลังการ */
.hero {
  grid-column: span 12;
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 36px;
  background: linear-gradient(135deg, var(--surface) 0%, rgba(255,255,255,0.02) 100%);
}

/* รูปโปรไฟล์หัวใจ/วิ้งๆ (Cute Bounce Profile) */
.avatar, .avatar-fallback {
  width: 110px; height: 110px;
  border-radius: 35px;
  border: 3px solid var(--accent);
  object-fit: cover;
  flex-shrink: 0;
  background: var(--surface);
  box-shadow: 0 0 25px var(--glow1);
  transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.avatar:hover, .avatar-fallback:hover {
  border-radius: 50%;
  transform: rotate(10deg) scale(1.1);
  box-shadow: 0 0 35px var(--accent);
}

.avatar-fallback {
  display: flex; align-items: center; justify-content: center;
  font-size: 44px; font-weight: 700; color: var(--accent);
}

.hero-text { flex: 1; min-width: 240px; }
.role {
  font: 700 12px/1 var(--mono);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 10px;
  display: inline-block;
  padding: 6px 12px;
  background: var(--glow1);
  border-radius: 20px;
}

h1 {
  font-size: clamp(32px, 5.5vw, 44px);
  line-height: 1.15;
  margin: 0 0 10px;
  font-weight: 800;
  background: linear-gradient(45deg, var(--text), var(--accent), #f472b6);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: gradientText 4s ease infinite;
}

@keyframes gradientText {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.tagline {
  font-size: clamp(16px, 2.4vw, 19px);
  color: var(--text);
  margin: 0;
  opacity: .95;
}

/* About & Links */
.about {
  grid-column: span 7;
  color: var(--muted);
  margin: 0;
  padding: 28px;
  font-size: 15.5px;
  display: flex;
  align-items: center;
  line-height: 1.8;
}

.links {
  grid-column: span 5;
  display: flex;
  flex-wrap: wrap;
  align-content: center;
  gap: 12px;
  padding: 28px;
  margin: 0;
  list-style: none;
}

.links a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1.5px solid var(--line);
  border-radius: 20px;
  padding: 10px 22px;
  color: var(--text);
  text-decoration: none;
  font-size: 14.5px;
  font-weight: 600;
  background: rgba(255,255,255,.03);
  transition: all .3s ease;
}

.links a:hover {
  border-color: var(--accent);
  color: var(--bg);
  background: var(--accent);
  box-shadow: 0 8px 20px var(--glow1);
  transform: translateY(-3px) scale(1.05);
}

/* Sections */
section {
  grid-column: span 6;
  margin-top: 0;
  padding: 28px;
  display: flex;
  flex-direction: column;
}

section:last-of-type {
  grid-column: span 12;
}

h2 {
  font: 700 13px/1 var(--mono);
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent);
  border-bottom: 2px dashed var(--line);
  padding-bottom: 14px;
  margin: 0 0 22px;
  display: flex;
  align-items: center;
  gap: 8px;
}

h2::before {
  content: "✦";
  font-size: 14px;
  animation: spinStar 3s linear infinite;
}

@keyframes spinStar { 100% { transform: rotate(360deg); } }

/* ลิสต์การเรียนรู้ป๊อปอัป */
.learning { list-style: none; padding: 0; margin: 0; }
.learning li {
  border-left: 4px solid var(--accent);
  background: linear-gradient(90deg, var(--glow1) 0%, transparent 100%);
  border-radius: 0 14px 14px 0;
  padding: 10px 18px;
  margin-bottom: 12px;
  color: var(--text);
  font-size: 15px;
  font-weight: 500;
  transition: all 0.3s ease;
}

.learning li:hover {
  transform: translateX(8px);
  background: var(--glow1);
  border-left-color: #f472b6;
}

/* Works */
.works { display: grid; gap: 16px; grid-template-columns: 1fr; }
.work {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px;
  background: rgba(0,0,0,.2);
  transition: all 0.3s ease;
}
.work:hover { border-color: var(--accent); transform: scale(1.02); }
.work h3 { margin: 0 0 6px; font-size: 17px; }
.work p { margin: 0; color: var(--muted); font-size: 14.5px; }
.work a { color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 600; display: inline-block; margin-top: 10px; }
.work a:hover { text-decoration: underline; }
.empty {
  border: 2px dashed var(--line);
  border-radius: 18px;
  padding: 36px 20px;
  color: var(--muted);
  text-align: center;
  font-size: 15px;
}

/* Panel ข้อมูลการเชื่อมต่อ */
.panel { border: none; border-radius: 0; background: transparent; padding: 0; }
.row {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px dashed var(--line);
  align-items: baseline;
}
.row:last-of-type { border-bottom: 0; }
.row dt { color: var(--muted); font-size: 14.5px; font-weight: 600; margin: 0; }
.row dd { margin: 0; font-family: var(--mono); font-size: 14.5px; color: var(--accent); font-weight: 600; word-break: break-all; }
.row .note { display: block; color: var(--muted); font-family: inherit; font-size: 13px; font-weight: 400; margin-top: 4px; }
.hint { color: var(--muted); font-size: 14px; margin: 18px 0 0; }

footer {
  grid-column: span 12;
  margin-top: 10px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 14.5px;
  text-align: center;
}
footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
footer a:hover { text-decoration: underline; }

/* Responsive */
@media (max-width: 768px) {
  .wrap { grid-template-columns: 1fr; gap: 18px; }
  .hero, .about, .links, section, section:last-of-type, footer {
    grid-column: span 1;
  }
  .hero { flex-direction: column; text-align: center; padding: 28px; }
  .row { grid-template-columns: 1fr; gap: 4px; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <img class="avatar" id="avatar" alt="" width="96" height="96">
    <div class="hero-text">
      <p class="role" id="role"></p>
      <h1 id="name"></h1>
      <p class="tagline" id="tagline"></p>
    </div>
  </header>
  <p class="about" id="about"></p>
  <ul class="links" id="links"></ul>

  <section>
    <h2>กำลังเรียนรู้</h2>
    <ul class="learning" id="learning"></ul>
  </section>

  <section>
    <h2>ผลงาน</h2>
    <div class="works" id="works"></div>
  </section>

  <section>
    <h2>ข้อมูลการเชื่อมต่อของหน้านี้</h2>
    <div class="panel">
      <dl id="netpanel"></dl>
      <p class="hint">กด F12 เลือกแท็บ Network แล้วกด Ctrl+F5 เพื่อเปรียบเทียบค่า</p>
    </div>
  </section>

  <footer>
    สร้างด้วย HTML, CSS และ JavaScript · โฮสต์บน GitHub Pages ·
    <a id="repolink" href="https://github.com">ดูซอร์สโค้ดของหน้านี้</a>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);

/* ---------- 1) นำข้อมูลจากกล่อง ME มาแสดง ---------- */
document.title = ME.name;
document.documentElement.dataset.theme = ME.theme || 'ocean';

$('role').textContent    = ME.role;
$('name').textContent    = ME.name;
$('tagline').textContent = ME.tagline;
$('about').textContent   = ME.about;

/* รูปโปรไฟล์ดึงจาก GitHub อัตโนมัติ ไม่ต้องอัปโหลดรูปเอง
   ถ้าโหลดไม่สำเร็จ (พิมพ์ username ผิด หรือเน็ตมีปัญหา) จะแสดงตัวอักษรแรกของชื่อแทน
   หน้าเว็บจะได้ไม่มีรูปแตกค้างอยู่ */
const avatar = $('avatar');
avatar.alt = 'รูปโปรไฟล์ของ ' + ME.name;
avatar.addEventListener('error', () => {
  const box = document.createElement('div');
  box.className = 'avatar-fallback';
  box.setAttribute('aria-hidden', 'true');
  box.textContent = (ME.name || '?').trim().charAt(0);
  avatar.replaceWith(box);
});
avatar.src = 'https://github.com/' + ME.github + '.png?size=192';

for (const item of ME.learning || []) {
  const li = document.createElement('li');
  li.textContent = item;          // ใช้ textContent เสมอ ปลอดภัยกว่า innerHTML
  $('learning').appendChild(li);
}

for (const link of ME.links || []) {
  const a = document.createElement('a');
  a.href = link.url;
  a.textContent = link.label;
  a.rel = 'noopener noreferrer';
  const li = document.createElement('li');
  li.appendChild(a);
  $('links').appendChild(li);
}

/* ผลงานยังว่างได้ ปี 1 เทอมแรกเป็นเรื่องปกติ */
if (!ME.works || ME.works.length === 0) {
  const box = document.createElement('div');
  box.className = 'empty';
  box.textContent = 'ยังไม่มีผลงานในหน้านี้ กำลังเรียนรู้อยู่ แล้วจะกลับมาเพิ่มเรื่อย ๆ';
  $('works').appendChild(box);
} else {
  for (const w of ME.works) {
    const card = document.createElement('div');
    card.className = 'work';
    const h3 = document.createElement('h3');
    h3.textContent = w.title;
    const p = document.createElement('p');
    p.textContent = w.desc;
    card.append(h3, p);
    if (w.url) {
      const a = document.createElement('a');
      a.href = w.url;
      a.textContent = 'ดูผลงาน ↗';
      a.rel = 'noopener noreferrer';
      card.appendChild(a);
    }
    $('works').appendChild(card);
  }
}

$('repolink').href = 'https://github.com/' + ME.github + '/' + ME.github + '.github.io';

/* ---------- 2) แผงข้อมูลการเชื่อมต่อ อ่านค่าจริงจาก Performance API ---------- */
function ms(v) {
  /* 0 ms ไม่ได้แปลว่าไม่มีค่า แต่แปลว่า browser ข้ามขั้นนั้นเพราะมีข้อมูลใน cache อยู่แล้ว */
  if (typeof v !== 'number' || v < 0 || Number.isNaN(v)) return '—';
  return Math.round(v) + ' ms';
}

window.addEventListener('load', () => setTimeout(() => {
  const nav = performance.getEntriesByType('navigation')[0];
  const rows = [
    ['Domain name', location.hostname || '(เปิดจากไฟล์ในเครื่อง)',
     'ชื่อโดเมนต้องถูกแปลงเป็น IP address ผ่าน DNS ก่อน จึงจะติดต่อ server ได้'],
    ['Protocol', location.protocol,
     'https คือ HTTP ที่เพิ่มการเข้ารหัสและการยืนยันตัวตน server ด้วย certificate'],
  ];
  if (nav) rows.push(
    ['HTTP version', nav.nextHopProtocol || '—',
     'h2 คือ HTTP/2 และ h3 คือ HTTP/3 ซึ่งส่งหลายไฟล์พร้อมกันได้ในการเชื่อมต่อเดียว'],
    ['DNS lookup', ms(nav.domainLookupEnd - nav.domainLookupStart),
     'เวลาที่ใช้แปลงชื่อโดเมนเป็น IP address ถ้าได้ 0 ms แปลว่ามีคำตอบอยู่ใน cache แล้ว'],
    ['Connection + TLS', ms(nav.connectEnd - nav.connectStart),
     'เวลาสร้างการเชื่อมต่อ รวมขั้นตอน TLS handshake ก่อนเริ่มรับส่งข้อมูลจริง'],
    ['TTFB', ms(nav.responseStart - nav.requestStart),
     'Time To First Byte เวลาตั้งแต่ส่ง request จนได้ข้อมูลไบต์แรกกลับมา ยิ่ง server ไกลยิ่งสูง'],
  );

  for (const [label, value, note] of rows) {
    const row = document.createElement('div');
    row.className = 'row';
    const dt = document.createElement('dt');
    dt.textContent = label;
    const dd = document.createElement('dd');
    dd.textContent = value;
    const small = document.createElement('span');
    small.className = 'note';
    small.textContent = note;
    dd.appendChild(small);
    row.append(dt, dd);
    $('netpanel').appendChild(row);
  }
}, 0));
</script>
</body>
</html>
