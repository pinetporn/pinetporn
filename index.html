<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinetporn | Quantum Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #090a0f;
            --card-bg: rgba(25, 30, 45, 0.6);
            --neon-cyan: #00f2fe;
            --neon-purple: #4facfe;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* เอฟเฟกต์แสงนีออนพื้นหลังแบบเคลื่อนไหว */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.3;
            animation: floatGlow 10s infinite alternate;
        }

        body::before {
            background: var(--neon-cyan);
            top: -100px;
            left: -100px;
        }

        body::after {
            background: var(--neon-purple);
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes floatGlow {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        .hero-container {
            width: 90%;
            max-width: 1100px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .hero-content {
            flex: 1;
            padding-right: 40px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: var(--neon-cyan);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-cyan);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        h1 {
            font-size: clamp(36px, 5vw, 64px);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ffffff 30%, var(--neon-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 20px;
            color: var(--text-muted);
            font-weight: 400;
            margin-bottom: 25px;
        }

        p {
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .cta-group {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-glow {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            border: none;
        }

        .btn-glow:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.7);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-outline:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            background: rgba(0, 242, 254, 0.05);
        }

        /* กรอบรูปภาพทรง Hologram ด้านขวา */
        .hologram-frame {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0,242,254,0.2), rgba(79,172,254,0.2));
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.15);
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        .hologram-frame::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 2px dashed rgba(0, 242, 254, 0.4);
            animation: rotateRing 20s linear infinite;
        }

        @keyframes rotateRing {
            100% { transform: rotate(360deg); }
        }

        .profile-img {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            filter: grayscale(20%) contrast(110%);
            transition: 0.5s;
        }

        .hologram-frame:hover .profile-img {
            filter: grayscale(0%);
            transform: scale(1.03);
        }

        /* Responsive สำหรับมือถือ */
        @media (max-width: 768px) {
            .hero-container {
                flex-direction: column-reverse;
                text-align: center;
                padding: 40px 20px;
            }
            .hero-content {
                padding-right: 0;
                margin-top: 30px;
            }
            .cta-group {
                justify-content: center;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <div class="hero-content">
            <div class="status-badge">
                <span class="status-dot"></span>
                SYSTEM ONLINE • PINEYPORN PORTFOLIO
            </div>
            <h1>Pinetporn</h1>
            <h2>Creative Developer & Tech Explorer</h2>
            <p>ยินดีต้อนรับสู่พื้นที่ดิจิทัลส่วนตัว ขับเคลื่อนด้วยไอเดียไร้ขีดจำกัด เทคโนโลยีล้ำสมัย และโค้ดที่เขียนด้วยความตั้งใจ 🚀</p>
            
            <div class="cta-group">
                <a href="https://github.com/pinetporn" class="btn btn-glow" target="_blank">⚡ Explore GitHub</a>
                <a href="#projects" class="btn btn-outline">📂 View Projects</a>
            </div>
        </div>

        <div class="hologram-frame">
            <img src="https://via.placeholder.com/250" alt="Pinetporn Profile" class="profile-img">
        </div>
    </div>

</body>
</html>
