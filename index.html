<script>
const $ = (id) => document.getElementById(id);

document.title = ME.name;
document.documentElement.dataset.theme = ME.theme || 'sakura';

$('role').textContent    = ME.role;
$('name').textContent    = ME.name;
$('tagline').textContent = ME.tagline;
$('about').textContent   = ME.about;

const avatar = $('avatar');
avatar.alt = 'รูปโปรไฟล์ของ ' + ME.name;
avatar.addEventListener('error', () => {
  const box = document.createElement('div');
  box.className = 'avatar-fallback';
  box.setAttribute('aria-hidden', 'true');
  box.textContent = (ME.name || '?').trim().charAt(0);
  avatar.replaceWith(box);
});
avatar.src = 'https://github.com/' + ME.github + '.png?size=192';

for (const item of ME.learning || []) {
  const li = document.createElement('li');
  li.textContent = item;
  $('learning').appendChild(li);
}

for (const link of ME.links || []) {
  const a = document.createElement('a');
  a.href = link.url;
  a.textContent = link.label;
  a.rel = 'noopener noreferrer';
  const li = document.createElement('li');
  li.appendChild(a);
  $('links').appendChild(li);
}

// ==========================================
// ส่วนที่เพิ่มเข้ามา: ฟังก์ชันคำนวณและแสดงข้อมูลการเชื่อมต่อ
// ==========================================
function renderNetworkPanel() {
  const panel = $('netpanel');
  if (!panel) return;

  // ดึงข้อมูล Performance Navigation Timing
  const perf = performance.getEntriesByType("navigation")[0];
  const protocol = location.protocol.replace(':', '');
  const domain = location.hostname;
  
  let httpVer = "h1.1";
  if (perf && perf.nextHopProtocol) {
    httpVer = perf.nextHopProtocol;
  }

  // คำนวณระยะเวลา (ms)
  const dns = perf ? Math.round(perf.domainLookupEnd - perf.domainLookupStart) : 0;
  const connection = perf ? Math.round(perf.connectEnd - perf.connectStart) : 0;
  const ttfb = perf ? Math.round(perf.responseStart - perf.requestStart) : 0;

  const netData = [
    {
      label: "Domain name",
      value: domain,
      note: "ชื่อโดเมนต้องถูกแปลงเป็น IP address ผ่าน DNS ก่อน จึงจะติดต่อ server ได้"
    },
    {
      label: "Protocol",
      value: protocol + ":",
      note: `${protocol} คือ HTTP ที่เพิ่มการเข้ารหัสและการยืนยันตัวตน server ด้วย certificate`
    },
    {
      label: "HTTP version",
      value: httpVer,
      note: `${httpVer} คือโปรโตคอลที่ใช้ในการส่งข้อมูลระหว่างเบราว์เซอร์กับเซิร์ฟเวอร์`
    },
    {
      label: "DNS lookup",
      value: `${dns < 0 ? 0 : dns} ms`,
      note: "เวลาที่ใช้แปลงชื่อโดเมนเป็น IP address ถ้าได้ 0 ms แปลว่ามีคำตอบอยู่ใน cache แล้ว"
    },
    {
      label: "Connection + TLS",
      value: `${connection < 0 ? 0 : connection} ms`,
      note: "เวลาร้างการเชื่อมต่อ รวมขั้นตอน TLS handshake ก่อนเริ่มรับส่งข้อมูลจริง"
    },
    {
      label: "TTFB",
      value: `${ttfb < 0 ? 0 : ttfb} ms`,
      note: "Time To First Byte เวลาตั้งแต่ส่ง request จนได้ข้อมูลไบต์แรกกลับมา ยิ่ง server ไกลยิ่งสูง"
    }
  ];

  panel.innerHTML = "";
  netData.forEach(item => {
    const row = document.createElement('div');
    row.className = 'row';
    
    const dt = document.createElement('dt');
    dt.textContent = item.label;
    
    const dd = document.createElement('dd');
    dd.innerHTML = `${item.value} <span class="note">${item.note}</span>`;
    
    row.appendChild(dt);
    row.appendChild(dd);
    panel.appendChild(row);
  });
}

// เรียกใช้ฟังก์ชันหลังจากโหลดหน้าเว็บเสร็จสมบูรณ์
window.addEventListener('load', renderNetworkPanel);
</script>
